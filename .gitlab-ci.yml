# relxill CI jobs

before_script:
  - source /data/software/profile.in
  - export RELXILL_TABLE_PATH="/userdata/data/dauser/relline_tables"

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - make model-stable
    - make model
  artifacts:
    expire_in: 30 min
    paths:
      - "relxill_model_v*.tgz"
      - "bin/"
      - "build/"

test:
  stage: test
  script:
    - make test 
    - make test-stable 

provide:
  stage: deploy
  script:
    - rsync -vhu relxill_model_v*.tgz /home/dauser/work/relxill/relxillArchive/
  only:
    - tags

# Publishing on https://github.com/thdauser/relxill (see RELEASE.md). Both jobs need the CI variable
# GITHUB_TOKEN (masked, protected), and master and the tags "v*" must be protected.

# every push to master: GitHub master follows (fast-forward only), which also rebuilds the docs there
github-master:
  stage: deploy
  variables:
    GIT_DEPTH: 0   # full history, a shallow clone cannot be pushed to GitHub
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - python3 ci/github_release.py --push-master

# release tag vx.y.z: push the tag and create the GitHub release with the tarball
github:
  stage: deploy
  variables:
    GIT_DEPTH: 0   # full history, a shallow clone cannot be pushed to GitHub
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - python3 ci/github_release.py "$CI_COMMIT_TAG"
